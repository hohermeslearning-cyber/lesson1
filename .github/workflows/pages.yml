name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  # allow manual re-deploys from the Actions tab
  workflow_dispatch:

# required for the official Pages deployment workflow
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate static site
        run: |
          echo "Static single-page app — no bundling step required"
          test -f index.html && echo "index.html present ($(wc -c < index.html) bytes)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
